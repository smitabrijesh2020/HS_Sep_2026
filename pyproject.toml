[project]
name = "hs-nomination-automation"
version = "0.1.0"
description = "HS Nomination Automation - lifecycle management for learning program nominations"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38,<2.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "msal>=1.28,<2.0",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "bandit>=1.7,<2.0",
]

[tool.setuptools.packages.find]
include = [
    "app", "app.*",
    "config", "config.*",
    "domain", "domain.*",
    "services", "services.*",
    "repositories", "repositories.*",
    "integrations", "integrations.*",
    "scheduler", "scheduler.*",
    "exports", "exports.*",
    "reporting", "reporting.*",
    "security", "security.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
